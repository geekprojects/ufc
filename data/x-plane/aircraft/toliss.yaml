# Commands #
############
commands:
  autopilot:
    ap1:
      toggle: toliss_airbus/ap1_push
    ap2:
      toggle: toliss_airbus/ap2_push
    localiser:
      toggle: toliss_airbus/loc_push
    approach:
      toggle: AirbusFBW/APPRbutton
    autoThrust:
      toggle: AirbusFBW/ATHRbutton
    expedite:
      toggle: AirbusFBW/EXPEDbutton
    airspeed:
      manage: toliss_airbus/spd_push
      guidance: toliss_airbus/spd_pull
    heading:
      manage: AirbusFBW/PushHDGSel
      guidance: AirbusFBW/PullHDGSel
    altitude:
      manage: AirbusFBW/PushAltitude
      guidance: AirbusFBW/PullAltitude
      step:
        100: AirbusFBW/ALT100_1000=0
        1000: AirbusFBW/ALT100_1000=1
    hdkTrk:
      toggle: toliss_airbus/hdgtrk_button_push
    verticalSpeed:
       manage: toliss_airbus/vs_push
       guidance: AirbusFBW/PullVSSel
    flightDirector:
      pilot:
        toggle: toliss_airbus/fd1_push
  aircraft:
    barometer:
      pilot:
        push: toliss_airbus/capt_baro_push
        std: toliss_airbus/capt_baro_pull
        mode:
          inHg: AirbusFBW/BaroUnitCapt=0
          hPa: AirbusFBW/BaroUnitCapt=1

  efis:
    ls:
      toggle: toliss_airbus/dispcommands/CaptLSButtonPush
    nd:
      constraints/toggle: toliss_airbus/dispcommands/CaptCstrPushButton
      waypoint/toggle: toliss_airbus/dispcommands/CaptWptPushButton
      vor/toggle: toliss_airbus/dispcommands/CaptVorDPushButton
      ndb/toggle: toliss_airbus/dispcommands/CaptNdbPushButton
      airport/toggle: toliss_airbus/dispcommands/CaptArptPushButton
      mode:
        ls: AirbusFBW/NDmodeCapt=0
        vor: AirbusFBW/NDmodeCapt=1
        nav: AirbusFBW/NDmodeCapt=2
        arc: AirbusFBW/NDmodeCapt=3
        plan: AirbusFBW/NDmodeCapt=4
      range:
        10: AirbusFBW/NDrangeCapt=0
        20: AirbusFBW/NDrangeCapt=1
        40: AirbusFBW/NDrangeCapt=2
        80: AirbusFBW/NDrangeCapt=3
        160: AirbusFBW/NDrangeCapt=4
        320: AirbusFBW/NDrangeCapt=5
    radio:
      pilot:
        1:
          adf: sim/instruments/EFIS_1_pilot_sel_adf
          off: sim/instruments/EFIS_1_pilot_sel_off
          vor: sim/instruments/EFIS_1_pilot_sel_vor
        2:
          adf: sim/instruments/EFIS_2_pilot_sel_adf
          off: sim/instruments/EFIS_2_pilot_sel_off
          vor: sim/instruments/EFIS_2_pilot_sel_vor

  cabin:
    chime: AirbusFBW/purser/all
  weight:
    calculateCG: AirbusFBW/SetWeightAndCG
  lights:
    landing: # life would be much easier if there were on/extend/off commands!
      left:
        on: |
          lua:
            lights = data['AirbusFBW/OHPLightSwitches[4]']
            if lights < 2 then
              command('toliss_airbus/lightcommands/LLandLightUp')
            end
            if lights == 0 then
              command('toliss_airbus/lightcommands/LLandLightUp')
            end
        extend: |
          lua:
            lights = data['AirbusFBW/OHPLightSwitches[4]']
            if lights == 0 then
              command('toliss_airbus/lightcommands/LLandLightUp')
            end
            if lights == 2 then
              command('toliss_airbus/lightcommands/LLandLightDown')
            end
              
        off: |
          lua:
            lights = data['AirbusFBW/OHPLightSwitches[4]']
            if lights > 0 then
              command('toliss_airbus/lightcommands/LLandLightDown')
            end
            if lights > 1 then
              command('toliss_airbus/lightcommands/LLandLightDown')
            end
      right:
        on: |
          lua:
