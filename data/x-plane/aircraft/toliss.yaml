        textA: AirbusFBW/MCDU1spa
      vertSlewKeys: AirbusFBW/MCDU1VertSlewKeys
    updateScript:
      lua: |
        for row=1,14 do
          local dr = 'fmc/0/line' .. row .. '/'

          -- The ToLiss aircraft separate the different colours/styles
          -- into different data refs. We need to munge these into
          -- the text and style datatypes used by UFC
          local types = {'Sym', 'A', 'B', 'G', 'M', 'W', 'Y', 'LG', 'LW'}
          line = {}
          for i, lineType in ipairs(types) do
            local v = data[dr .. 'text' .. lineType]
            if v ~= nil and type(v) == "table" then
              line[lineType] = v;
            end

            v = data[dr .. 'textS' .. lineType]
            if v ~= nil and type(v) == "table" then
              line[lineType .. '_Small'] = v;
            end
          end

          value = {}
          local textColour = {}
          local small = {}
          for col=1,24 do
            local t = string.byte('w')

            local character = string.byte(' ')
            local charColour = string.byte('w')
            local charSmall
            if math.fmod(row, 2) == 0 and row < 14 then
              charSmall = string.byte('Y')
            else
              charSmall = string.byte(' ')
            end

            local hasSym = false
            for type, v in pairs(line) do

              local typeChar = v[col]
              --print(" -> type=" .. type .. ", char=" , typeChar)
              if typeChar ~= nil and typeChar ~= string.byte(" ") then
                if not hasSym then
                  character = typeChar
                end

                local idx = string.find(type, "_Small")
                if idx ~= nil then
                  charSmall = string.byte('Y')
                end
                if string.sub(type, 1, 3) == "Sym" then
                  hasSym = true
                  if character == string.byte("A") then
                    character = string.byte("[")
                  elseif character == string.byte("B") then
                    character = string.byte("]")
                  elseif character == string.byte("0") then
                    character = 0x2190
                  elseif character == string.byte("1") then
                    character = 0x2192
                  elseif character == string.byte("2") then
                    character = 0x2190
                  elseif character == string.byte("3") then
                    character = 0x2192
                  elseif character == string.byte("E") then
                    character = 0x2610
                  elseif character == string.byte("`") then
                    character = 0x00B0
                  end
                else
                  local typeColour = string.sub(type, 1, 1)
                  if typeColour == "A" then
                    t = string.byte('a')
                  elseif typeColour == "B" then
                    t = string.byte('c')
                  elseif typeColour == "G" then
                    t = string.byte('g')
                  elseif typeColour == "M" then
                    t = string.byte('m')
                  elseif typeColour == "Y" then
                    t = string.byte('y')
                  end

                  if character == string.byte("`") then
                    character = 0x00B0
                  end
                end

                if not hasSym then
                  break
                end
              end
            end

            if row == 14 and  col == 23 and data['fmc/0/vertSlewKeys'] == 1 then
              character = 0x2191
              charSmall = 'Y'
            elseif row == 14 and  col == 24 and data['fmc/0/vertSlewKeys'] == 1 then
              character = 0x2193
              charSmall = 'Y'
            end

            table.insert(value , character)
            table.insert(small , charSmall)
            table.insert(textColour , t)

          end
          -- Write the line to the common FMC format
          data[dr .. 'textColour'] = textColour
          data[dr .. 'text'] = value
          data[dr .. 'small'] = small
        end

