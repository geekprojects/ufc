          if adirs == 2 then
            command('toliss_airbus/adirucommands/ADIRU3SwitchDown')
          end
      att: |
        lua:
          adirs = data['AirbusFBW/ADIRUSwitchArray[2]']
          if adirs < 2 then
            command('toliss_airbus/adirucommands/ADIRU3SwitchUp')
          end
          if adirs < 1 then
            command('toliss_airbus/adirucommands/ADIRU3SwitchUp')
          end

