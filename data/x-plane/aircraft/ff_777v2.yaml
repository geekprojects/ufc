name: FlightFactor 777-200ER v2
author: FlightFactor and StepToSky
icao:
  - B772
  - B77W

data:
  autopilot:
    ap1Mode: 1-sim/ckpt/lampsGlow/mcpCaptAP
    ap2Mode: 1-sim/ckpt/lampsGlow/mcpFoAP
    autoThrottleMode: 1-sim/ckpt/lampsGlow/mcpAT
    locMode: 1-sim/ckpt/lampsGlow/mcpLOC
    approachMode: 1-sim/ckpt/lampsGlow/mcpAPP
    heading: 1-sim/output/mcp/hdg
    speed: 1-sim/output/mcp/spd
    altitude: 1-sim/output/mcp/alt
    verticalSpeed: 1-sim/output/mcp/vs
    fmsVnav: 1-sim/ckpt/lamps/mcpVNAV
    headingTrkMode: "!1-sim/output/mcp/isHdgTrg"
    verticalSpeedFPAMode: "!1-sim/output/mcp/isVsTrg"
    displaySpeed: 1-sim/output/mcp/isSpdOpen
    displayVerticalSpeed: 1-sim/output/mcp/isVsOpen
    flightDirector:
      pilot:
        on: 1-sim/ckpt/mcpFdLSwitch/anim
  aircraft:
    barometer:
      pilot:
        mode: 1-sim/ckpt/cptHsiBaroModeRotary/anim
  fmc:
    0:
      symbols: 1-sim/cduL/display/symbols
      colours: 1-sim/cduL/display/symbolsColor
      sizes: 1-sim/cduL/display/symbolsSize
      updateScript:
        lua: |
          local pos = 1
          local syms = data['fmc/0/symbols']
          local colours = data['fmc/0/colours']
          local sizes = data['fmc/0/sizes']
          if type(syms) == "table" and type(colours) == "table" and type(sizes) == "table" then
            for row = 1,14 do
              local line = {}
              local textColour = {}
              local small = {}
              for col = 1,24 do
                local character = syms[pos]
                if character == string.byte('#') then
                  character = 0x2610
                end

                local symCol = colours[pos]
                local t = string.byte('w')
                if symCol == 4 then
                  t = string.byte('c')
                elseif symCol == 5 then
                  t = string.byte('g')
                end

                local symSize = sizes[pos]
                local charSmall = ' '
                if symSize == 2 then
                  charSmall = 'Y'
                end

                table.insert(line, character);
                table.insert(textColour, t);
                table.insert(small, charSmall);
                pos = pos + 1
              end
              data['fmc/0/line' .. row .. '/text']=line
              data['fmc/0/line' .. row .. '/textColour']=textColour
              data['fmc/0/line' .. row .. '/small']=small
            end
          end

commands:
  autopilot:
    ap1:
      toggle: 1-sim/command/mcpApLButton_button
    autoThrust:
      toggle: 1-sim/command/mcpAtButton_button
    localiser:
      toggle: 1-sim/command/mcpLocButton_button
    approach:
      toggle: 1-sim/command/mcpAppButton_button
    altitude:
      up: "1-sim/command/mcpAltRotary_rotary+"
      down: 1-sim/command/mcpAltRotary_rotary-
      manage: 1-sim/command/mcpAltRotary_push
      step:
        100: 1-sim/command/mcpAltModeSwitch_switch-
        1000: 1-sim/command/mcpAltModeSwitch_switch+
    airspeed:
      up: 1-sim/command/mcpSpdRotary_rotary+
      down: 1-sim/command/mcpSpdRotary_rotary-
      manage: 1-sim/command/mcpSpdRotary_push
    heading:
      up: 1-sim/command/mcpHdgRotary_rotary+
      down: 1-sim/command/mcpHdgRotary_rotary-
      manage: 1-sim/command/mcpHdgCelButton_button
    verticalSpeed:
      up: 1-sim/command/mcpVsRotary_rotary+
      down: 1-sim/command/mcpVsRotary_rotary-
      manage: 1-sim/command/mcpAltHoldButton_button
    spdMach:
      toggle: 1-sim/command/mcpIasMachButton_button
    hdkTrk:
      toggle: 1-sim/command/mcpHdgTrkButton_button
    vsFpa:
      toggle: 1-sim/command/mcpVsFpaButton_button
    flightDirector:
      pilot:
        toggle: 1-sim/command/mcpFdLSwitch_trigger
  aircraft:
    barometer:
      pilot:
        up: 1-sim/command/cptHsiBaroRotary_rotary+
        down: 1-sim/command/cptHsiBaroRotary_rotary-
        std: 1-sim/command/cptHsiStdButton_button
        mode:
          inHg: 1-sim/command/cptHsiBaroModeRotary_switch-
          hPa: 1-sim/command/cptHsiBaroModeRotary_switch+
  efis:
    nd:
      constraints/toggle: 1-sim/command/cptHsiDataButton_button
      waypoint/toggle: 1-sim/command/cptHsiWptButton_button
      vor/toggle: 1-sim/command/cptHsiStaButton_button
      ndb/toggle: 1-sim/command/cptHsiStaButton_button
      airport/toggle: 1-sim/command/cptHsiArptButton_button

